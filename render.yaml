# Blueprint do Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: spbim-prospeccao
    runtime: node
    plan: starter            # plano pago necessário para disco persistente
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false          # o Render pede o valor na criação
    disk:
      name: leads
      mountPath: /var/data
      sizeGB: 1
